name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint --workspaces

      - name: Typecheck (api)
        run: npx tsc --noEmit -p packages/api/tsconfig.json

      - name: Typecheck (worker)
        run: npx tsc --noEmit -p packages/worker/tsconfig.json

      - name: Test (worker)
        run: npm run test --workspace=packages/worker

      - name: Build
        run: npm run build --workspaces
