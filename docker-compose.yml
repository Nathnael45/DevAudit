services:
  # Not published to the host — only api/worker need to reach these, over the
  # docker network. Use `docker compose exec postgres psql -U devaudit` (or the
  # equivalent for redis-cli) for local inspection instead of a host port.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: devaudit
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devaudit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://devaudit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/devaudit
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in .env}
      PORT: 3001
      # CORS is restricted to this origin (see app.ts) — must match wherever
      # the web app is actually reachable, not just the local default.
      WEB_URL: ${WEB_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /tmp/devaudit-repos:/tmp/devaudit-repos

  worker:
    build:
      context: ./packages/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://devaudit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/devaudit
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_URL: http://api:3001
      INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET in .env}
      REPOS_DIR: /tmp/devaudit-repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - repos:/tmp/devaudit-repos

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
      # Baked into the JS bundle at build time — leave unset for local dev
      # (falls back to same-host-different-port), set both in .env to your
      # real host/domain for any deployment where api and web aren't on the
      # same hostname.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:3001
    depends_on:
      - api

volumes:
  postgres_data:
  repos: